<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif; }
    a { color: #35544E; } a:hover { color: #243B36; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #FAFAF9; color: #46423D; display: flex; flex-direction: column;">

  <div style="padding: 22px 24px 0 24px; display: flex; flex-direction: column; gap: 28px;">

    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #8B857E;">このさき</div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 25px; line-height: 1.5; font-weight: 700; color: #1A1917; letter-spacing: 0.01em;">働き方を変えると、<br>うちはどうなる？</div>
      <div style="font-size: 14px; line-height: 1.8; color: #6E6862;">3つ答えると、選べる道を並べて比べられます。</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px;">

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; font-weight: 700; color: #8B857E; letter-spacing: 0.06em;">1 ／ 3　いまの貯蓄と投資</div>
        <div style="display: flex; align-items: baseline; gap: 10px; background: #FFFFFF; border: 1px solid #CEC8C0; padding: 14px 16px;">
          <div style="font-size: 26px; font-weight: 700; color: #1A1917; font-variant-numeric: tabular-nums; letter-spacing: -0.01em;">300</div>
          <div style="font-size: 14px; color: #8B857E;">万円</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; font-weight: 700; color: #8B857E; letter-spacing: 0.06em;">2 ／ 3　毎月つみたてている額</div>
        <div style="display: flex; align-items: baseline; gap: 10px; background: #FFFFFF; border: 1px solid #CEC8C0; padding: 14px 16px;">
          <div style="font-size: 26px; font-weight: 700; color: #1A1917; font-variant-numeric: tabular-nums; letter-spacing: -0.01em;">18</div>
          <div style="font-size: 14px; color: #8B857E;">万円</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; font-weight: 700; color: #8B857E; letter-spacing: 0.06em;">3 ／ 3　働き方が変わる予定</div>

        <div style="background: #FFFFFF; border: 1px solid #CEC8C0; display: flex; flex-direction: column;">

          <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid #E6E2DC;">
            <div style="font-size: 13px; color: #8B857E;">だれが</div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="font-size: 15px; font-weight: 500; color: #1A1917;">パートナー</div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B857E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid #E6E2DC;">
            <div style="font-size: 13px; color: #8B857E;">いつから</div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="font-size: 15px; font-weight: 500; color: #1A1917; font-variant-numeric: tabular-nums;">2027年4月</div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B857E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 16px;">
            <div style="font-size: 13px; color: #8B857E;">いまの額面年収</div>
            <div style="display: flex; align-items: baseline; gap: 4px;">
              <div style="font-size: 15px; font-weight: 500; color: #1A1917; font-variant-numeric: tabular-nums;">380</div>
              <div style="font-size: 13px; color: #8B857E;">万円</div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 24px; display: flex; flex-direction: column; gap: 14px;">
    <div style="background: #1A1917; color: #FAFAF9; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; letter-spacing: 0.04em;">並べて比べる</div>
    <div style="font-size: 11.5px; line-height: 1.7; color: #8B857E; text-align: center;">税・社会保険料・保育料はこちらで計算します。<br>あとからいくらでも直せます。</div>
  </div>

</div>
</x-dc>
</body>
</html>
