name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# 同じブランチへの連続pushでは古い実行をキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型チェック & ビルド
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: ビルド
        run: npm run build
